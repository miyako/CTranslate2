<script>
document.addEventListener("DOMContentLoaded", () => {
  document.querySelectorAll("pre > code").forEach((codeBlock) => {
    const pre = codeBlock.parentNode;
    const wrapper = document.createElement("div");
    wrapper.className = "code-wrapper";
    pre.parentNode.insertBefore(wrapper, pre);
    wrapper.appendChild(pre);

    // Create button
    const button = document.createElement("button");
    button.className = "copy-btn";
    button.type = "button";
    button.setAttribute("aria-label", "Copy code to clipboard");
    button.setAttribute("data-tooltip", "Copied!");
    button.innerHTML = `
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" viewBox="0 0 24 24">
        <path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1z"/>
        <path d="M20 5H8c-1.1 0-2 .9-2 2v16h14c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2z"/>
      </svg>
      Copy
    `;
    wrapper.appendChild(button);
    const status = document.createElement("span");
    status.setAttribute("role", "status");
    status.className = "copy-status";
    wrapper.appendChild(status);

    // Copy behavior
    button.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(codeBlock.innerText);
        status.textContent = "Code copied.";
        button.setAttribute("data-tooltip", "Copied!");
        button.classList.add("show-tooltip");
        setTimeout(() => button.classList.remove("show-tooltip"), 1200);
      } catch (err) {
        console.error("Copy failed:", err);
        status.textContent = "Copy failed. Select the code and copy it manually.";
        button.setAttribute("data-tooltip", "Copy failed");
        button.classList.add("show-tooltip");
        setTimeout(() => button.classList.remove("show-tooltip"), 2500);
      }
    });
  });
});
</script>
