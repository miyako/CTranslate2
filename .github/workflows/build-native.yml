name: Build native server

on:
  pull_request:
    paths:
      - 'cpp/**'
      - 'scripts/ci/**'
      - '.github/workflows/build-native.yml'
      - 'build.md'
  push:
    branches: [main]
    paths:
      - 'cpp/**'
      - 'scripts/ci/**'
      - '.github/workflows/build-native.yml'
      - 'build.md'
  workflow_dispatch:
    inputs:
      signed_macos:
        description: 'Sign and notarize both macOS DMGs (requires all Apple secrets)'
        type: boolean
        default: true
        required: true
      update_libraries:
        description: 'Open a PR replacing IDE-project static libraries and headers (main only)'
        type: boolean
        default: true
        required: true

permissions:
  contents: read

concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            arch: x86_64
            rust_host: x86_64-apple-darwin
          - os: macos-15
            arch: arm64
            rust_host: aarch64-apple-darwin
          - os: windows-2025
            arch: x86_64
            rust_host: x86_64-pc-windows-msvc
          - os: windows-11-arm
            arch: arm64
            rust_host: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      RUSTUP_TOOLCHAIN: 1.91.0-${{ matrix.rust_host }}
      BUILD_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          architecture: ${{ matrix.arch == 'arm64' && 'arm64' || 'x64' }}
      - name: Static SDK export regression tests
        run: python -m unittest discover -s scripts/ci -p 'test_*.py'
      - name: Pinned build tools
        shell: bash
        run: |
          python -m pip install cmake==3.31.6 ninja==1.11.1.4
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          cmake --version
          rustc --version
      - name: Fresh dependency build, smoke test and install
        run: python scripts/ci/build-native.py --arch ${{ matrix.arch }}
      - name: Upload reusable static libraries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ct2-sdk-${{ runner.os }}-${{ matrix.arch }}
          path: .build-native/sdk-artifacts/*.zip
          if-no-files-found: error
          retention-days: 14
      - name: Sign and notarize macOS distribution
        if: runner.os == 'macOS' && github.event_name == 'workflow_dispatch' && inputs.signed_macos
        shell: bash
        env:
          APPLE_DEVELOPER_ID_CERTIFICATE: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE }}
          APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          CODESIGN_APPLE_ID: ${{ secrets.CODESIGN_APPLE_ID }}
          NOTARYTOOL_APPLE_ID: ${{ secrets.NOTARYTOOL_APPLE_ID }}
          NOTARYTOOL_TEAM_ID: ${{ secrets.NOTARYTOOL_TEAM_ID }}
          NOTARYTOOL_PASSWORD: ${{ secrets.NOTARYTOOL_PASSWORD }}
        run: bash scripts/ci/sign-macos.sh
      - name: Package unsigned build
        if: runner.os != 'macOS' || github.event_name != 'workflow_dispatch' || !inputs.signed_macos
        run: python scripts/ci/package-native.py --name ct2-server-${{ runner.os }}-${{ matrix.arch }}-unsigned
      - name: Upload distribution
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ct2-server-${{ runner.os }}-${{ matrix.arch }}-${{ runner.os == 'macOS' && github.event_name == 'workflow_dispatch' && inputs.signed_macos && 'signed' || 'unsigned' }}
          path: .build-native/packages/*
          if-no-files-found: error
          retention-days: 14

  propose-libraries:
    name: Propose IDE library replacements
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.update_libraries && github.ref == 'refs/heads/main'
    runs-on: macos-15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          token: ${{ secrets.NATIVE_LIBRARIES_PR_TOKEN || github.token }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          architecture: arm64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: ct2-sdk-*
          merge-multiple: true
          path: .build-native/downloads
      - name: Combine Mac architectures and replace project dependencies
        run: python scripts/ci/prepare-native-pr.py
      - name: Verify the Xcode project with replacement archives
        run: |
          xcodebuild -project cpp/ct2-server.xcodeproj -target ct2-server \
            -configuration Release -arch arm64 CODE_SIGNING_ALLOWED=NO
          python scripts/ci/smoke-server.py cpp/macOS/ct2-server
          xcodebuild -project cpp/ct2-server.xcodeproj -target ct2-server \
            -configuration Release -arch x86_64 CODE_SIGNING_ALLOWED=NO
      - name: Open dependency update PR
        env:
          GH_TOKEN: ${{ secrets.NATIVE_LIBRARIES_PR_TOKEN || github.token }}
        run: python scripts/ci/open-native-pr.py
