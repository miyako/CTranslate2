theme: jekyll-theme-minimal

markdown: kramdown
kramdown:
  syntax_highlighter: rouge
highlighter: rouge
plugins_dir: _plugins
baseurl: /CTranslate2

title: "CTranslate2"
description: "Local Transformers, no GPU required. CTranslate2 for 4D on Mac and Windows."
logo: "/assets/logo.png"
image: "/assets/logo.png"
navigation:
  - label: Get started
    items:
      - title: Overview
        url: /
      - title: 4D integration
        url: /integration.html
      - title: Native builds & downloads
        url: /build.html
  - label: Work with models
    items:
      - title: Chat
        url: /chat.html
      - title: Embeddings & reranking
        url: /embeddings.html
      - title: Generation
        url: /generate.html
      - title: Translation
        url: /translate.html
  - label: Reference
    items:
      - title: CLI & model catalog
        url: /CLI.html
github:
  is_user_page: true
  owner_url: "https://github.com/miyako"
  repository_url: "https://github.com/miyako/CTranslate2"
  is_project_page: false

exclude:
  - "vendor"
  - "resources"
  - "LICENSE"
  - "README.md"
  - "SITE-DESIGN.md"
  - "Gemfile"
  - "cpp"
  - "CTranslate2"
  - "package.json"
  - "JsonCpp-1.9.8"
  - "CT2-4.7.1"
  - "sentencepiece"
  - "scripts"
  - "Gemfile.lock"
